services:
  postgres:
    image: postgres:16
    container_name: cyberdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberdex
      POSTGRES_PASSWORD: cyberdex_dev_password
      POSTGRES_DB: cyberdex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: